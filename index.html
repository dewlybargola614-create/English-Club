<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Guanmiao Ambassadors</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f2e9; --card:#ffffff; --ink:#1c2333; --muted:#5f6779; --line:#e4dccb;
  --brand:#1f3a68; --brand-2:#2d5ca6; --brand-soft:#e8eef8;
  --accent:#f2b23a; --accent-ink:#5a3d00;
  --mine:#fff5d6; --mine-border:#f2b23a;
  --ok:#17834a; --ok-bg:#ddf3e5; --bad:#cf3434; --bad-bg:#fde6e6; --free:#2b67cc; --free-bg:#e5eefc;
  --shadow:0 1px 2px rgba(28,35,51,.06),0 4px 14px rgba(28,35,51,.06);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.zh{font-size:.86em;color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:10px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.topbar .who{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:10px;min-width:0}
.topbar .who .badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:44px;height:44px;display:grid;place-items:center;font-weight:900;font-size:1.1rem}
.topbar .who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:8px 12px;min-height:44px;font-weight:600;font-size:.92rem}
.tbtn:active{background:rgba(255,255,255,.25)}
.sync{font-size:.8rem;opacity:.9;white-space:nowrap}
.pbar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;width:120px}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ptext{font-size:.85rem;font-weight:600;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;min-height:46px;font-weight:650;font-size:.95rem;line-height:1.15;text-align:left}
.btn .zh{font-size:.8rem;font-weight:500}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary .zh{color:#dfe8fb}
.btn.mic{background:#fff0f0;border-color:#f3b9b9;color:#9b1c1c}
.btn.mic .zh{color:#b04848}
.btn.rec{background:#fff4e0;border-color:#f0cf91;color:#7a4b00}
.btn.rec .zh{color:#94681b}
.btn.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.btn.live .zh{color:#ffe1e1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(207,52,52,.45)}50%{box-shadow:0 0 0 8px rgba(207,52,52,0)}}
.btn.small{min-height:40px;padding:6px 11px;font-size:.88rem}
.ico{font-size:1.15em;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- home ---------- */
.hero{background:var(--brand);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 0 64px;position:relative;overflow:hidden}
.hero h1{margin:0;font-size:2rem;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:.4rem 0 0;opacity:.9}
.hero .zh{color:#cfdaf0}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--accent);opacity:.18}
.homecard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-top:-40px;padding:22px 18px 26px;position:relative}
.homecard h2{margin:0 0 4px;font-size:1.15rem}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;margin-top:16px}
.numbtn{aspect-ratio:1;border-radius:22px;border:0;font-size:2.1rem;font-weight:900;color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.numbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.c0{background:#2d5ca6}.c1{background:#e0802a}.c2{background:#178a6a}.c3{background:#b5487d}.c4{background:#6a55c2}.c5{background:#c79a12}.c6{background:#1f8bb3}
.homelinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}

/* ---------- dialog ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,26,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h3{margin:0 0 6px;font-size:1.3rem}
.codein{width:100%;font-size:2rem;letter-spacing:.4em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px;margin:14px 0 8px}
.codein:focus{outline:none;border-color:var(--brand-2)}
.err{color:var(--bad);font-weight:600;min-height:1.4em;font-size:.95rem}
.note{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:.92rem;color:#24406f}
.warn{background:#fff3d6;border:1px solid #f0d28c;border-radius:12px;padding:10px 12px;font-size:.92rem;color:#6a4a00}

/* ---------- scenes ---------- */
.scenetabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.scenetabs::-webkit-scrollbar{display:none}
.stab{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px;font-weight:700;display:flex;align-items:center;gap:6px}
.stab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stab .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.stab .done{color:var(--ok);font-weight:900}
.stab.on .done{color:#9ff0bf}
.scenehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 12px}
.scenehead h2{margin:0;font-size:1.45rem;line-height:1.2}
.scenehead .kicker{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}

.lines{display:flex;flex-direction:column;gap:12px;padding-bottom:40px}
.place{font-weight:800;color:var(--brand);margin:8px 0 -4px;font-size:1rem}
.place .zh{font-weight:600}
.line{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--shadow);transition:box-shadow .2s, border-color .2s}
.line.mine{background:var(--mine);border-color:var(--mine-border);border-width:2px}
.line.reading{box-shadow:0 0 0 4px rgba(45,92,166,.35)}
.lhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.spk{font-size:.8rem;font-weight:800;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 10px}
.line.mine .spk{background:var(--accent);color:var(--accent-ink)}
.yours{font-size:.78rem;font-weight:800;color:#8a5a00;letter-spacing:.03em}
.status{margin-left:auto;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#eee;color:#555}
.status.passed{background:var(--ok-bg);color:var(--ok)}
.status.tried{background:#fff0d0;color:#8a5a00}
.ltext{display:flex;align-items:flex-start;gap:8px}
.words{font-size:1.4rem;font-weight:600;line-height:1.55;flex:1}
.line:not(.mine) .words{font-size:1.15rem;font-weight:500}
.w{display:inline-block;border-radius:7px;padding:0 2px;margin:0 1px;cursor:pointer;transition:background .15s}
.w:active,.w.tap{background:rgba(45,92,166,.18)}
.w.ok{color:var(--ok);background:var(--ok-bg)}
.w.bad{color:var(--bad);background:var(--bad-bg)}
.w.miss{color:var(--bad);background:var(--bad-bg);text-decoration:underline dotted;text-underline-offset:4px}
.w.free{color:var(--free);background:var(--free-bg)}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--muted);color:var(--muted);text-align:center}
.say{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:1.25rem;display:grid;place-items:center}
.ltrans{margin-top:2px}
.tools{margin-top:12px;padding-top:12px;border-top:1px dashed #e9cf8c;display:flex;flex-direction:column;gap:10px}
.result{background:#fff;border-radius:12px;border:1px solid var(--line);padding:10px 12px}
.result .score{font-weight:900;font-size:1.25rem}
.result .heard{font-size:.95rem;color:var(--muted);margin-top:4px;word-break:break-word}
.result .msg{font-weight:700}
.recbox{background:#fff;border-radius:12px;border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.recbox audio{width:100%;height:44px}
.recstate{font-size:.88rem;color:var(--muted)}
.recstate.ok{color:var(--ok);font-weight:700}
.recstate.bad{color:var(--bad);font-weight:700}
.fill{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fill label{display:flex;flex-direction:column;font-size:.85rem;font-weight:700;color:var(--muted);gap:4px}
.fill input,.fill select{min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:1.05rem;background:#fff;color:var(--ink);min-width:110px}
.fill input.name{min-width:180px}

/* ---------- progress card ---------- */
.pcard{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.pshot{padding:22px;background:#fff}
.pshot .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.pshot .ph .badge{background:var(--accent);color:var(--accent-ink);border-radius:16px;width:58px;height:58px;display:grid;place-items:center;font-weight:900;font-size:1.5rem}
.pshot h3{margin:0;font-size:1.3rem}
.pbig{height:14px;background:#eee;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.pbig>i{display:block;height:100%;background:var(--ok)}
.pscene{margin-top:14px}
.pscene h4{margin:0 0 6px;font-size:.95rem;color:var(--brand)}
.pline{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.pline .words{font-size:1.05rem;font-weight:600}
.pline .meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.pfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- teacher ---------- */
.tcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.trow{display:grid;grid-template-columns:52px 1.3fr 1.6fr .8fr 1fr;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.trow.head{background:#faf7f0;font-size:.8rem;font-weight:800;color:var(--muted);cursor:default}
.trow .n{font-weight:900;color:#fff;border-radius:12px;height:40px;display:grid;place-items:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{width:18px;height:18px;border-radius:5px;background:#e6e1d6}
.chip.tried{background:#f2c35f}
.chip.passed{background:var(--ok)}
.tdetail{padding:6px 14px 16px;background:#fcfaf5;border-bottom:1px solid var(--line)}
.tline{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.tline .words{font-size:1.05rem;font-weight:600}
.tline .meta{font-size:.85rem;color:var(--muted);margin-top:4px}
.small{font-size:.85rem;color:var(--muted)}
textarea.paste{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:1.1rem;background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-size:.95rem;max-width:calc(100% - 32px);text-align:center}
@media (max-width:640px){
  .trow{grid-template-columns:44px 1fr 1fr;}
  .trow .hide-s{display:none}
  .words{font-size:1.25rem}
  .hero h1{font-size:1.6rem}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   SETTINGS — the only part you normally need to change
   ===================================================================== */

// 1) After you deploy the Google Apps Script, paste the Web app URL between the quotes.
//    Leave it empty ('') to use TEST MODE (no codes, progress saves only on this device).
const SCRIPT_URL = '';

// 2) Number of students (icons on the homepage).
const NUM_STUDENTS = 14;

// 3) The script. "who" = the speaker numbers for that line.
//    'ALL' = everyone. 'EACH' = every student says their own version.
//    To change a speaker, just change the number(s) in who: [ ... ].
const SCENES = [
  { id:'1A', title:'Welcome at the school gate', zh:'在校門口歡迎', lines:[
    { who:[1], text:"Hello, everyone! We are student ambassadors.", zh:"大家好！我們是學生大使。" },
    { who:[2], text:"We are from Guanmiao Junior High School in Tainan, Taiwan.", zh:"我們來自台灣台南的關廟國中。" },
    { who:[3], text:"Today, we will show you our school.", zh:"今天，我們要帶大家看看我們的學校。" },
    { who:'ALL', text:"Welcome to Guanmiao Junior High School!", zh:"歡迎來到關廟國中！" },
  ]},
  { id:'1B', title:'Our town', zh:'我們的小鎮', lines:[
    { who:[1], text:"Our town, Guanmiao, is famous for three things.", zh:"我們的小鎮關廟，有三樣東西很有名。" },
    { who:[13], text:"Pineapples!", zh:"鳳梨！" },
    { who:[12], text:"Bamboo shoots!", zh:"竹筍！" },
    { who:[14], text:"Noodles!", zh:"關廟麵！" },
    { who:[2], text:"Now, come and see our school!", zh:"現在，來看看我們的學校吧！" },
  ]},
  { id:'2', title:'Introductions', zh:'自我介紹', lines:[
    { who:'EACH', label:'Each student', text:"Hello! My name is {name}. I'm in Grade {grade}. I'm in Class {cls}.", zh:"哈囉！我的名字是 ____。我讀 ____ 年級。我在 ____ 班。" },
    // Put the 3–5 speaker numbers here when you decide, e.g. who:[3,6,9]
    { who:[], label:'One group (3 to 5)', text:"We go to Guanmiao Junior High School.", zh:"我們就讀關廟國中。" },
  ]},
  { id:'3', title:'Our vision', zh:'我們的願景', lines:[
    { who:'ALL', text:"Our school's vision is: Help every child succeed.", zh:"我們學校的願景是：幫助每個孩子成功。" },
  ]},
  { id:'4', title:'How our school helps us', zh:'學校怎麼幫助我們', lines:[
    { who:[13,4,5], label:'Group 1', text:"Our school helps us learn new things.", zh:"我們的學校幫助我們學習新事物。" },
    { who:[14,6,7], label:'Group 2', text:"Our school helps us make friends.", zh:"我們的學校幫助我們交朋友。" },
    { who:[8,9,3], label:'Group 3', text:"Our school helps us improve our English.", zh:"我們的學校幫助我們讓英文進步。" },
    { who:[10,11,12], label:'Group 4', text:"Our school helps us discover our interests.", zh:"我們的學校幫助我們發掘自己的興趣。" },
  ]},
  { id:'5', title:'School tour', zh:'校園導覽', lines:[
    { place:'Library', placeZh:'圖書館', who:[13], text:"This is our library.", zh:"這是我們的圖書館。" },
    { who:[6], text:"We can read books here. It's quiet and beautiful!", zh:"我們可以在這裡看書。這裡安靜又漂亮！" },
    { place:'Gym', placeZh:'體育館', who:[14], text:"This is our gym.", zh:"這是我們的體育館。" },
    { who:[7], text:"We can play basketball here. It's big and fun!", zh:"我們可以在這裡打籃球。這裡又大又好玩！" },
    { place:'Classroom', placeZh:'教室', who:[4], text:"This is our classroom.", zh:"這是我們的教室。" },
    { who:[3], text:"We can learn English here. Our teachers are friendly!", zh:"我們可以在這裡學英文。我們的老師很友善！" },
    { place:'Computer room', placeZh:'電腦教室', who:[5], text:"This is our computer room.", zh:"這是我們的電腦教室。" },
    { who:[8], text:"We can use computers here. We can learn new things!", zh:"我們可以在這裡用電腦。我們可以學到新東西！" },
    { place:'Martial arts room', placeZh:'武術教室', who:[1], text:"This is our martial arts room.", zh:"這是我們的武術教室。" },
    { who:[2], text:"We can learn martial arts here. It's cool!", zh:"我們可以在這裡學武術。很酷！" },
    { place:'Arts and crafts room', placeZh:'美勞教室', who:[9], text:"This is our arts and crafts room.", zh:"這是我們的美勞教室。" },
    { who:[10], text:"We can paint and make things here. It's beautiful!", zh:"我們可以在這裡畫畫和做東西。這裡很漂亮！" },
    { place:'Performance arts room', placeZh:'表演藝術教室', who:[11], text:"This is our performance arts room.", zh:"這是我們的表演藝術教室。" },
    { who:[12], text:"We can sing and dance here. It's fun!", zh:"我們可以在這裡唱歌跳舞。很好玩！" },
  ]},
  { id:'5b', title:'My favorite place', zh:'我最喜歡的地方', lines:[
    { who:[1], text:"My favorite place is the {place}. It's {adj}.", zh:"我最喜歡的地方是 ____。它很 ____。" },
    { who:[2], text:"My favorite place is the {place}. It's {adj}.", zh:"我最喜歡的地方是 ____。它很 ____。" },
  ]},
  { id:'6', title:'Back to the gate', zh:'回到校門口', lines:[
    { who:[5], text:"Our tour is almost finished.", zh:"我們的導覽快要結束了。" },
    { who:[8], text:"We love our school. It's fun and friendly!", zh:"我們愛我們的學校。它有趣又友善！" },
    { who:[10], text:"We hope you like it!", zh:"希望你們喜歡！" },
    { who:[2], text:"Let's go back to the gate!", zh:"我們回校門口吧！" },
  ]},
  { id:'7', title:'Goodbye', zh:'再見', lines:[
    { who:'ALL', text:"Come and visit our school! Thank you for watching! Goodbye!", zh:"歡迎來參觀我們的學校！謝謝收看！再見！" },
  ]},
];

// Choices for the fill-in blanks
const PLACES = [
  ['library','圖書館'],['gym','體育館'],['classroom','教室'],['computer room','電腦教室'],
  ['martial arts room','武術教室'],['arts and crafts room','美勞教室'],['performance arts room','表演藝術教室']
];
const ADJS = [['quiet','安靜'],['big','大'],['fun','好玩'],['cool','酷'],['beautiful','漂亮'],['friendly','友善']];
const GRADES = ['7','8','9'];

// Words the computer does not check (names it may not know). Shown in blue.
const FREE_WORDS = ['guanmiao'];

/* =====================================================================
   Below this line is the program. You don't need to change it.
   ===================================================================== */
const TEST_MODE = !SCRIPT_URL;
const LS = 'amb1_';
const COLORS = 7;

// ---------- build line list ----------
const LINES = [];
SCENES.forEach(sc => sc.lines.forEach((ln, i) => {
  ln.id = sc.id + '-' + (i + 1);
  ln.scene = sc.id;
  LINES.push(ln);
}));
function isMine(ln, num){
  if (ln.who === 'ALL' || ln.who === 'EACH') return true;
  return Array.isArray(ln.who) && ln.who.includes(num);
}
function myLines(num){ return LINES.filter(l => isMine(l, num)); }
function whoLabel(ln){
  if (ln.who === 'ALL') return 'ALL';
  if (ln.who === 'EACH') return ln.label || 'Each student';
  const nums = (ln.who || []).map(n => '#' + n).join(', ');
  if (ln.label) return ln.label + (nums ? ' (' + nums + ')' : ' (to be decided)');
  return nums || '—';
}
function needsBlanks(ln){ return /\{(name|grade|cls|place|adj)\}/.test(ln.text); }
function blanksFilled(ln, p){
  const keys = (ln.text.match(/\{(\w+)\}/g) || []).map(s => s.slice(1, -1));
  return keys.every(k => p && String(p[k] || '').trim());
}
// returns array of {text, free, blank}
function lineWords(ln, profile, fill){
  const out = [];
  ln.text.split(/\s+/).forEach(tok => {
    const m = tok.match(/^(.*)\{(\w+)\}(.*)$/);
    if (!m) { out.push({ text: tok, free: FREE_WORDS.includes(core(tok).toLowerCase()) }); return; }
    const [, pre, key, post] = m;
    const val = fill && profile ? String(profile[key] || '').trim() : '';
    if (!val) { out.push({ text: pre + '____' + post, blank: true }); return; }
    const parts = val.split(/\s+/);
    parts.forEach((p, i) => out.push({
      text: (i === 0 ? pre : '') + p + (i === parts.length - 1 ? post : ''),
      free: key === 'name'
    }));
  });
  return out;
}
function lineText(ln, profile, fill){ return lineWords(ln, profile, fill).map(w => w.text).join(' '); }
function core(tok){ return tok.replace(/^[^A-Za-z0-9’']+|[^A-Za-z0-9’']+$/g, ''); }

// ---------- checker ----------
const CONTR = {
  "i'm":['i','am'],"it's":['it','is'],"its":['it','is'],"let's":['let','us'],"lets":['let','us'],
  "we're":['we','are'],"you're":['you','are'],"they're":['they','are'],"that's":['that','is'],
  "what's":['what','is'],"there's":['there','is'],"he's":['he','is'],"she's":['she','is'],
  "i'll":['i','will'],"we'll":['we','will'],"you'll":['you','will'],"don't":['do','not'],"doesn't":['does','not'],
  "can't":['can','not'],"cannot":['can','not'],"isn't":['is','not'],"aren't":['are','not'],"i've":['i','have'],"we've":['we','have']
};
const NUMW = {zero:0,oh:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,
  thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50};
const NUM_SAFE = new Set(Object.keys(NUMW).filter(w => w !== 'oh' && w !== 'one' && w !== 'two'));
function units(word, isTarget){
  let w = word.toLowerCase().replace(/[’‘`]/g, "'");
  const out = [];
  w.split(/[-–—]/).forEach(part => {
    part = part.replace(/[^a-z0-9']/g, '').replace(/^'+|'+$/g, '');
    if (!part) return;
    if (CONTR[part]) { CONTR[part].forEach(k => out.push({ key: k, alts: [k] })); return; }
    if (part.endsWith("'s")) { const b = part.slice(0, -2); out.push({ key: b, alts: [b, b + 's'] }); return; }
    part = part.replace(/'/g, '');
    if (/^\d+$/.test(part)) { out.push({ key: part, alts: [part] }); return; }
    // number words → digits (one/two only when they are the target, to avoid "to"→"two" confusion)
    if (NUMW[part] !== undefined && (NUM_SAFE.has(part) || isTarget)) { const d = String(NUMW[part]); out.push({ key: d, alts: [d, part] }); return; }
    out.push({ key: part, alts: [part] });
  });
  return out;
}
function heardKeys(transcript){
  const keys = [];
  String(transcript || '').split(/\s+/).forEach(w => units(w, false).forEach(u => keys.push(u.key)));
  return keys;
}
// words: [{text, free}] ; returns {words:[{text,status,heard}], score, correct, total}
function checkSpeech(words, transcript){
  const T = [];
  words.forEach((w, d) => {
    const us = units(w.text, true);
    us.forEach(u => T.push({ ...u, d, free: !!w.free }));
  });
  const H = heardKeys(transcript);
  const n = T.length, m = H.length, INF = 1e9;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(INF));
  const bk = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(null));
  dp[0][0] = 0;
  const relax = (i, j, c, b) => { if (c < dp[i][j]) { dp[i][j] = c; bk[i][j] = b; } };
  for (let i = 0; i <= n; i++) for (let j = 0; j <= m; j++) {
    const c = dp[i][j]; if (c >= INF) continue;
    if (i < n) {
      const t = T[i];
      if (t.free) { for (let k = 0; k <= 3 && j + k <= m; k++) relax(i + 1, j + k, c + (k === 0 ? 0.01 : 0), { t: 'free', pi: i, pj: j, k }); }
      else {
        if (j < m) { const eq = t.alts.includes(H[j]); relax(i + 1, j + 1, c + (eq ? 0 : 1), { t: eq ? 'ok' : 'sub', pi: i, pj: j, h: H[j] }); }
        if (j + 1 < m && t.alts.includes(H[j] + H[j + 1])) relax(i + 1, j + 2, c, { t: 'ok', pi: i, pj: j });
        relax(i + 1, j, c + 1, { t: 'del', pi: i, pj: j });
      }
    }
    if (j < m) relax(i, j + 1, c + 1, { t: 'ins', pi: i, pj: j });
  }
  const st = new Array(n);
  let i = n, j = m;
  while (i > 0 || j > 0) {
    const b = bk[i][j]; if (!b) break;
    if (b.t !== 'ins') st[b.pi] = b;
    i = b.pi; j = b.pj;
  }
  const res = words.map(w => ({ text: w.text, status: w.free ? 'free' : 'ok', heard: [] }));
  let total = 0, correct = 0;
  T.forEach((t, k) => {
    const b = st[k] || { t: 'del' };
    const r = res[t.d];
    if (t.free) return;
    total++;
    if (b.t === 'ok') { correct++; return; }
    if (b.t === 'sub') { r.status = 'bad'; r.heard.push(b.h); }
    else if (r.status !== 'bad') r.status = 'miss';
  });
  res.forEach((r, d) => { if (words[d].free) r.status = 'free'; });
  const score = total ? Math.round(100 * correct / total) : 100;
  return { words: res, score, correct, total, passed: total > 0 ? correct === total : true };
}

// ---------- text to speech ----------
const TTS = {
  voice: null, rate: 0.9,
  pick(){
    const vs = speechSynthesis.getVoices();
    const en = vs.filter(v => /^en[-_]US/i.test(v.lang));
    const pref = ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Alex', 'Ava', 'Allison'];
    this.voice = pref.map(p => en.find(v => v.name.includes(p))).find(Boolean) || en.find(v => v.localService) || en[0] || vs.find(v => /^en/i.test(v.lang)) || null;
  },
  speak(text, opts = {}){
    if (!('speechSynthesis' in window)) { toast('This device cannot read aloud. 這台裝置無法朗讀。'); return Promise.resolve(); }
    if (!opts.queue) speechSynthesis.cancel();
    if (!this.voice) this.pick();
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; if (this.voice) u.voice = this.voice;
      u.rate = opts.rate || this.rate;
      u.onend = u.onerror = () => res();
      if (opts.onstart) u.onstart = opts.onstart;
      speechSynthesis.speak(u);
    });
  },
  stop(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); }
};
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = () => TTS.pick(); TTS.pick(); }

// ---------- speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let busy = null; // only one microphone activity at a time
function recognize(maxMs, onInterim){
  // returns {promise, stop}
  let rec, done = false, finalText = '', interimText = '', alts = [], silenceTimer, maxTimer, endTimer;
  let resolveFn, rejectFn;
  const promise = new Promise((res, rej) => { resolveFn = res; rejectFn = rej; });
  const finish = (err) => {
    if (done) return; done = true;
    clearTimeout(silenceTimer); clearTimeout(maxTimer); clearTimeout(endTimer);
    try { rec && rec.abort(); } catch (e) {}
    if (err) rejectFn(err);
    else { const t = (finalText + ' ' + interimText).trim(); resolveFn({ text: t, alts: alts.length ? alts : [t] }); }
  };
  const stop = () => {
    if (done) return;
    try { rec.stop(); } catch (e) {}
    endTimer = setTimeout(() => finish(), 1500);
  };
  try {
    rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 3;
    rec.onresult = (e) => {
      let f = '', it = '';
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) f += ' ' + r[0].transcript; else it += ' ' + r[0].transcript;
      }
      finalText = f.trim(); interimText = it.trim();
      if (e.results.length === 1 && e.results[0].isFinal) {
        alts = Array.from(e.results[0]).map(a => a.transcript);
      } else alts = [];
      onInterim && onInterim((finalText + ' ' + interimText).trim());
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(stop, 1800);
    };
    rec.onerror = (e) => { if (e.error === 'no-speech' || e.error === 'aborted') finish(); else finish(e.error || 'error'); };
    rec.onend = () => finish();
    rec.start();
    maxTimer = setTimeout(stop, maxMs);
  } catch (e) { finish('start'); }
  return { promise, stop };
}
function srErrorText(err){
  if (err === 'not-allowed') return 'The microphone is blocked. Tap "Allow" when Safari asks, or check Settings → Safari → Microphone. 麥克風被封鎖了，請允許使用麥克風。';
  if (err === 'service-not-allowed') return 'Speech checking is turned off on this iPad. Turn on Settings → General → Keyboard → Enable Dictation. 請到「設定 → 一般 → 鍵盤」開啟「聽寫」。';
  if (err === 'network') return 'No internet. Speech checking needs Wi-Fi. 沒有網路，語音檢查需要網路。';
  if (err === 'audio-capture') return 'No microphone found. 找不到麥克風。';
  return 'Something went wrong. Please try again. 發生錯誤，請再試一次。';
}

// ---------- audio recording ----------
function recMime(){
  if (!window.MediaRecorder) return null;
  const c = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
  return c.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
}
function extFor(mime){ return /webm/.test(mime) ? 'webm' : /ogg/.test(mime) ? 'ogg' : 'm4a'; }
async function startRecording(maxMs, onTick){
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const mime = recMime();
  const mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  const chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const t0 = Date.now();
  const tick = setInterval(() => onTick && onTick(Date.now() - t0), 250);
  let stopTimer;
  const promise = new Promise(res => {
    mr.onstop = () => {
      clearInterval(tick); clearTimeout(stopTimer);
      stream.getTracks().forEach(t => t.stop());
      const type = mr.mimeType || mime || 'audio/mp4';
      res(new Blob(chunks, { type }));
    };
  });
  mr.start();
  stopTimer = setTimeout(() => { if (mr.state !== 'inactive') mr.stop(); }, maxMs);
  return { promise, stop: () => { if (mr.state !== 'inactive') mr.stop(); } };
}
function blobToB64(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
function b64ToBlob(b64, mime){
  const bin = atob(b64); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: mime || 'audio/mp4' });
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
}

async function api(action, payload){
  const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) });
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.error || 'error'); e.code = j.error; throw e; }
  return j;
}
const lsGet = (k, d) => { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} };

// Current student state
const S = { num: 0, code: '', profile: {}, progress: {}, recordings: {}, localRec: {}, pending: [], sync: 'ok' };

function cacheKey(n){ return 's' + n; }
function saveCache(){ lsSet(cacheKey(S.num), { profile: S.profile, progress: S.progress }); lsSet('pending' + S.num, S.pending); }

async function login(num, code){
  if (TEST_MODE) {
    const c = lsGet(cacheKey(num), {});
    Object.assign(S, { num, code, profile: c.profile || {}, progress: c.progress || {}, recordings: {}, localRec: S.num === num ? S.localRec : {}, pending: [] });
    return;
  }
  const j = await api('login', { num, code });
  const c = lsGet(cacheKey(num), {});
  const pending = lsGet('pending' + num, []);
  const progress = j.progress || {};
  // keep anything saved on this iPad that didn't reach Google yet
  pending.forEach(it => { if (!progress[it.lineId] || (progress[it.lineId].updated || 0) < it.updated) progress[it.lineId] = it; });
  const profile = j.profile || {};
  if (c.profile && !profile.name && c.profile.name) Object.assign(profile, c.profile);
  Object.assign(S, { num, code, profile, progress, recordings: j.recordings || {}, localRec: S.num === num ? S.localRec : {}, pending });
  saveCache();
  flush();
}
function setSync(s){ S.sync = s; const el = document.getElementById('sync'); if (el) el.innerHTML = syncHtml(); }
function syncHtml(){
  if (TEST_MODE) return 'Test mode · saved on this iPad only';
  return { ok: 'Saved ✓ 已儲存', saving: 'Saving… 儲存中', offline: 'Not saved yet — will retry 尚未儲存，稍後重試' }[S.sync] || '';
}
let flushing = false;
async function flush(){
  if (TEST_MODE || flushing || !S.pending.length) return;
  flushing = true; setSync('saving');
  const items = S.pending.slice();
  try {
    await api('saveProgress', { num: S.num, code: S.code, items });
    S.pending = S.pending.filter(p => !items.includes(p));
    saveCache(); setSync('ok');
  } catch (e) { setSync('offline'); setTimeout(() => { flushing = false; flush(); }, 15000); return; }
  flushing = false;
  if (S.pending.length) flush();
}
function recordAttempt(ln, text, result, heard){
  const prev = S.progress[ln.id] || { tries: 0, best: 0, passed: false };
  const item = {
    lineId: ln.id, scene: ln.scene, text,
    passed: prev.passed || result.passed, best: Math.max(prev.best || 0, result.score),
    tries: (prev.tries || 0) + 1, heard, last: result.score, updated: Date.now()
  };
  S.progress[ln.id] = item;
  S.pending = S.pending.filter(p => p.lineId !== ln.id); S.pending.push(item);
  saveCache(); flush();
  return item;
}
async function saveProfile(){
  saveCache();
  if (TEST_MODE) return;
  try { setSync('saving'); await api('saveProfile', { num: S.num, code: S.code, profile: S.profile }); setSync('ok'); }
  catch (e) { setSync('offline'); }
}

// ---------- tiny DOM helpers ----------
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c === null || c === undefined || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
function bi(en, zh){ return [h('span', null, en), zh ? h('span', { class: 'zh' }, zh) : null]; }
function btn(icon, en, zh, cls, onclick){ return h('button', { class: 'btn ' + (cls || ''), onclick }, h('span', { class: 'ico' }, icon), h('span', null, en, h('br'), h('span', { class: 'zh' }, zh))); }
let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast' }, msg); document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3500);
}

function fmtDate(t){ if (!t) return '—'; const d = new Date(t); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
function slug(s){ return s.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40); }

/* =====================================================================
   LINE CARD (a sentence with Listen / Try it / Record)
   mode: 'student' (saves), 'view' (not your line), 'practice' (free practice, no saving)
   ===================================================================== */
function lineCard(ln, mode, refresh){
  const mine = mode !== 'view';
  const card = h('div', { class: 'line' + (mine ? ' mine' : ''), 'data-id': ln.id });
  let lastResult = null, lastHeard = '';
  const getWords = () => lineWords(ln, S.profile, mine);
  const getText = () => lineText(ln, S.profile, mine);

  function statusPill(){
    if (mode !== 'student') return null;
    const p = S.progress[ln.id];
    if (!p) return h('span', { class: 'status' }, 'Not yet 還沒練習');
    if (p.passed) return h('span', { class: 'status passed' }, '✓ Passed 通過');
    return h('span', { class: 'status tried' }, 'Best ' + p.best + '% 最佳');
  }

  function render(){
    card.innerHTML = '';
    const head = h('div', { class: 'lhead' },
      mode === 'practice' ? null : h('span', { class: 'spk' }, whoLabel(ln)),
      mine && mode === 'student' ? h('span', { class: 'yours' }, '★ YOUR LINE 你的台詞') : null,
      statusPill());
    if (head.childNodes.length) card.append(head);
    const words = getWords();
    card.append(h('div', { class: 'ltext' },
      wordsEl(words, lastResult),

    const tools = h('div', { class: 'tools' });

  async function doTry(b){

    const target = card.querySelector('.btn.mic');
    const words = getWords();
    const maxMs = Math.min(25000, 5000 + words.length * 700);
    busy = 'try';
    if (target) { target.classList.add('live'); target.querySelector('span:last-child').innerHTML = 'Listening… tap to stop<br><span class="zh">聆聽中…點一下停止</span>'; }
    const live = h('div', { class: 'result' }, h('div', { class: 'heard' }, '🎙 Say your line now… 現在說出你的台詞…'));
    target && target.closest('.row').after(live);
    const r = recognize(maxMs, t => { live.firstChild.textContent = '🎙 ' + t; });
    if (target) target.onclick = (e) => { e.stopImmediatePropagation(); r.stop(); };
    try {
      const out = await r.promise;
      busy = null;
      if (!out.text) { lastResult = null; render(); toast("I didn't hear anything. Try again, a bit louder. 沒聽到聲音，請大聲一點再試一次。"); return; }
      // choose the alternative that matches best
      let best = null, bestText = out.text;
      out.alts.forEach(a => { const c = checkSpeech(words, a); if (!best || c.score > best.score) { best = c; bestText = a; } });
      lastResult = best; lastHeard = bestText;
      if (mode === 'student') { recordAttempt(ln, getText(), best, bestText); refresh && refresh(); }
      render();
    } catch (err) {
      busy = null; render(); toast(srErrorText(err));
    }
  }

  // ----- recording -----
  function recState(){ return S.localRec[ln.id] || null; }
  async function doRecord(){
    if (busy) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Recording does not work in this browser. Please use Safari. 這個瀏覽器不能錄音，請用 Safari。'); return; }
    TTS.stop();
    busy = 'rec';
    const target = card.querySelector('.btn.rec');
    let rec;
    try {
      rec = await startRecording(30000, ms => { if (target) target.querySelector('span:last-child').innerHTML = 'Recording ' + fmtTime(ms) + ' · tap to stop<br><span class="zh">錄音中…點一下停止</span>'; });
    } catch (e) {
      busy = null; toast(srErrorText(e && e.name === 'NotAllowedError' ? 'not-allowed' : 'audio-capture')); return;
    }
    if (target) { target.classList.add('live'); target.onclick = (e) => { e.stopImmediatePropagation(); rec.stop(); }; }
    const blob = await rec.promise;
    busy = null;
    const st = { blob, url: URL.createObjectURL(blob), state: mode === 'student' && !TEST_MODE ? 'sending' : 'local' };
    S.localRec[ln.id] = st;
    render();
    if (st.state === 'sending') upload(st);
  }
  async function upload(st){
    st.state = 'sending'; render();
    try {
      const b64 = await blobToB64(st.blob);
      const j = await api('uploadRecording', { num: S.num, code: S.code, lineId: ln.id, text: getText(), mime: st.blob.type, base64: b64 });
      S.recordings[ln.id] = j.recording; st.state = 'sent';
    } catch (e) { st.state = 'failed'; }
    render(); refresh && refresh();
  }
  function fileName(blob){
    const who = mode === 'practice' ? 'practice' : '#' + String(S.num).padStart(2, '0');
    return who + '_Scene' + ln.scene + '_' + slug(getText()) + '.' + extFor(blob.type);
  }
  function recBox(){
    const st = recState();
    const saved = mode === 'student' ? S.recordings[ln.id] : null;
    if (!st && !saved) return null;
    const box = h('div', { class: 'recbox' });
    if (st) {
      box.append(h('audio', { controls: true, src: st.url, preload: 'auto' }));
      const stateTxt = {
        local: TEST_MODE && mode === 'student' ? 'Test mode: this recording is not sent to the teacher. 測試模式：錄音不會傳給老師。' : 'Your recording 你的錄音',
        sending: 'Sending to teacher… 傳送給老師中…', sent: '✓ Sent to teacher 已傳給老師', failed: '✗ Not sent. Tap "Send again". 傳送失敗，請點「再傳一次」。'
      }[st.state];
      box.append(h('div', { class: 'recstate ' + (st.state === 'sent' ? 'ok' : st.state === 'failed' ? 'bad' : '') }, stateTxt));
    } else {
      box.append(h('div', { class: 'recstate ok' }, '✓ Your recording is saved for the teacher. 你的錄音已存給老師。'));
      const holder = h('div');
      box.append(holder);
      holder.append(btn('▶', 'Play my recording', '播放我的錄音', 'small', async (e) => {
        const b = e.currentTarget; b.disabled = true;
        try {
          const j = await api('getRecording', { num: S.num, code: S.code, fileId: saved.fileId });
          const blob = b64ToBlob(j.base64, j.mime);
          S.localRec[ln.id] = { blob, url: URL.createObjectURL(blob), state: 'sent' };
          render();
          const a = card.querySelector('audio'); a && a.play().catch(() => {});
        } catch (err) { b.disabled = false; toast('Could not load the recording. 無法載入錄音。'); }
      }));
    }
    const row = h('div', { class: 'row' });
    if (st && st.state === 'failed') row.append(btn('↻', 'Send again', '再傳一次', 'small primary', () => upload(st)));
    row.append(btn('🗑', 'Delete', '刪除', 'small', async () => {
      if (!confirm('Delete this recording? 要刪除這個錄音嗎？')) return;
      delete S.localRec[ln.id];
      if (mode === 'student' && !TEST_MODE && S.recordings[ln.id]) {
        try { await api('deleteRecording', { num: S.num, code: S.code, lineId: ln.id }); delete S.recordings[ln.id]; }
        catch (e) { toast('Could not delete on Google. Check the internet. 無法刪除，請檢查網路。'); }
      }
      render(); refresh && refresh();
    }));
    row.append(btn('⏺', 'Record again', '重錄', 'small rec', () => doRecord()));
    if (st) row.append(btn('⬇', 'Download', '下載', 'small', () => downloadBlob(st.blob, fileName(st.blob))));
    box.append(row);
    return box;
  }

  card._render = render;
  render();
  return card;
}

function fillForm(ln, onSave){
  const p = S.profile;
  const keys = (ln.text.match(/\{(\w+)\}/g) || []).map(s => s.slice(1, -1));
  const form = h('div', { class: 'fill' });
  const inputs = {};
  const sel = (key, opts, label) => {
    const s = h('select', null, h('option', { value: '' }, '—'), opts.map(([v, z]) => h('option', { value: v }, z ? v + '  ' + z : v)));
    s.value = p[key] || '';
    inputs[key] = s;
    return h('label', null, label, s);
  };
  keys.forEach(k => {
    if (k === 'name') { const i = h('input', { class: 'name', placeholder: 'Your English name', autocomplete: 'off', autocapitalize: 'words' }); i.value = p.name || ''; inputs.name = i; form.append(h('label', null, 'My name 我的名字', i)); }
    if (k === 'grade') form.append(sel('grade', GRADES.map(g => [g]), 'Grade 年級'));
    if (k === 'cls') { const i = h('input', { inputmode: 'numeric', placeholder: 'e.g. 3', autocomplete: 'off', style: 'min-width:90px;width:110px' }); i.value = p.cls || ''; inputs.cls = i; form.append(h('label', null, 'Class 班級', i)); }
    if (k === 'place') form.append(sel('place', PLACES, 'Place 地方'));
    if (k === 'adj') form.append(sel('adj', ADJS, 'It\'s… 形容詞'));
  });
  form.append(btn('✓', 'Save', '儲存', 'primary small', () => {
    keys.forEach(k => { p[k] = String(inputs[k].value || '').trim().replace(/\s+/g, ' '); });
    saveProfile(); onSave && onSave(); toast('Saved! 已儲存！');
  }));
  return form;
}

function renderStudent(n){
  const sess = ssGet('session');

    app.innerHTML = '';

      bar.innerHTML = '';
      bar.append(h('div', { class: 'wrap' },
        h('div', { class: 'who' }, h('span', { class: 'badge' }, '#' + n), h('span', { class: 'nm' }, S.profile.name || 'Student ' + n)),
        h('div', { class: 'spacer' }),

        h('div', { id: 'sync', class: 'sync', style: 'width:100%;text-align:right' }, syncHtml())));
    };
    const drawTabs = () => {
      tabs.innerHTML = '';
      SCENES.forEach(sc => {
        const ml = sc.lines.filter(l => isMine(l, n));
        const done = ml.length && ml.every(l => S.progress[l.id] && S.progress[l.id].passed);
        tabs.append(h('button', { class: 'stab' + (sc.id === currentScene ? ' on' : ''), onclick: () => { currentScene = sc.id; TTS.stop(); drawTabs(); drawScene(); window.scrollTo(0, 0); } },
          'Scene ' + sc.id, done ? h('span', { class: 'done' }, '✓') : ml.length ? h('span', { class: 'dot', title: 'You have lines here' }) : null));
      });
      const on = tabs.querySelector('.on'); on && on.scrollIntoView({ inline: 'center', block: 'nearest' });
    };
    const refresh = () => { drawBar(); drawTabs(); };
    const drawScene = () => {
      const sc = SCENES.find(s => s.id === currentScene);
      body.innerHTML = '';
      const linesBox = h('div', { class: 'lines' });
      let playing = false;
      const playBtn = btn('▶', 'Listen to the whole scene', '聽整個場景', 'primary', async () => {
        if (playing) { playing = false; TTS.stop(); return; }
        playing = true; playBtn.querySelector('span:last-child').innerHTML = 'Stop<br><span class="zh">停止</span>';
        for (const ln of sc.lines) {
          if (!playing) break;
          const el = linesBox.querySelector('[data-id="' + ln.id + '"]');
          const t = lineText(ln, S.profile, isMine(ln, n)).replace(/____/g, '');
          await TTS.speak(t, { queue: true, onstart: () => { el && el.classList.add('reading'); el && el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } });
          el && el.classList.remove('reading');
        }
        playing = false; playBtn.querySelector('span:last-child').innerHTML = 'Listen to the whole scene<br><span class="zh">聽整個場景</span>';
      });
      body.append(h('div', { class: 'scenehead' },
        h('div', null, h('div', { class: 'kicker' }, 'Scene ' + sc.id), h('h2', null, sc.title, ' ', h('span', { class: 'zh' }, sc.zh))),
        playBtn));
      body.append(h('div', { class: 'legend' },
        h('span', null, h('i', { class: 'sw', style: 'background:var(--mine);border:2px solid var(--mine-border)' }), 'Your lines 你的台詞'),
        h('span', null, 'Tap any word to hear it. 點一下單字就能聽發音。')));
      sc.lines.forEach(ln => {
        if (ln.place) linesBox.append(h('div', { class: 'place' }, ln.place, ' ', h('span', { class: 'zh' }, ln.placeZh)));
        linesBox.append(lineCard(ln, isMine(ln, n) ? 'student' : 'view', refresh));
      });
      body.append(linesBox);
    };
    if (!currentScene || !SCENES.some(s => s.id === currentScene)) {
      const firstTodo = mine.find(l => !(S.progress[l.id] && S.progress[l.id].passed));
      currentScene = firstTodo ? firstTodo.scene : SCENES[0].id;
    }
    refresh(); drawScene();
  };
  if (S.num === n) { start(); return; }
  // page was reloaded: log in again with the saved session
  app.innerHTML = '<div class="wrap" style="padding:40px 16px">Loading… 載入中…</div>';
  login(n, sess.code).then(start).catch(e => { ssSet('session', null); renderHome(); codeDialog(n); });
}

let h2cPromise;
function loadH2C(){
  if (window.html2canvas) return Promise.resolve();
  h2cPromise = h2cPromise || new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = res; s.onerror = () => { h2cPromise = null; rej(); };
    document.head.append(s);
  });
  return h2cPromise;
}

  const err = h('div', { class: 'err' });
  const b = h('button', { class: 'btn primary', style: 'width:100%;justify-content:center;min-height:52px' }, 'Open teacher view');
  const submit = async () => { b.disabled = true; err.textContent = ''; const ok = await loadTeacher(input.value.trim(), body, bar, err); if (!ok) b.disabled = false; };
  b.onclick = submit; input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  body.append(h('div', { class: 'dialog', style: 'margin:30px auto' }, h('h3', null, 'Teacher code'), h('div', { class: 'small' }, 'Your teacher code is in the "Students" sheet, in the row named TEACHER.'), input, err, b));
  setTimeout(() => input.focus(), 50);
}

async function loadTeacher(code, body, bar, errEl){
  let data;
  if (TEST_MODE) {
    data = { students: [], progress: {}, recordings: {} };
    for (let n = 1; n <= NUM_STUDENTS; n++) {
      const c = lsGet(cacheKey(n), {});
      data.students.push({ num: n, ...(c.profile || {}) });
      data.progress[n] = c.progress || {};
    }
  } else {
    try { data = await api('teacherData', { code }); }
    catch (e) { if (errEl) errEl.textContent = e.code === 'wrong_code' ? 'Wrong teacher code.' : 'No connection. Check the internet.'; return false; }
    ssSet('teacher', { code });
  }
  const wrap = bar.querySelector('.wrap');
  wrap.querySelectorAll('.tb-x').forEach(x => x.remove());
  wrap.append(
    h('button', { class: 'tbtn tb-x', onclick: () => { body.innerHTML = 'Loading…'; loadTeacher(code, body, bar); } }, '↻ Refresh'),
    TEST_MODE ? null : h('button', { class: 'tbtn tb-x', onclick: () => { ssSet('teacher', null); go('#/'); } }, 'Log out'));
  body.innerHTML = '';
  if (TEST_MODE) body.append(testBanner());

  const students = data.students.slice().sort((a, b) => a.num - b.num);
  const allLines = students.reduce((s, st) => s + myLines(st.num).length, 0);
  const allPassed = students.reduce((s, st) => s + myLines(st.num).filter(l => ((data.progress[st.num] || {})[l.id] || {}).passed).length, 0);
  body.append(h('div', { class: 'scenehead', style: 'margin-top:18px' },
    h('div', null, h('div', { class: 'kicker' }, 'Whole class'), h('h2', null, allPassed + ' / ' + allLines + ' lines passed')),
    h('div', { class: 'small' }, 'Updated ' + fmtDate(Date.now()) + '. Tap a student to see each line and play recordings.')));
  body.append(h('div', { class: 'legend' },
    h('span', null, h('i', { class: 'sw', style: 'background:var(--ok)' }), 'passed'),
    h('span', null, h('i', { class: 'sw', style: 'background:#f2c35f' }), 'tried'),
    h('span', null, h('i', { class: 'sw', style: 'background:#e6e1d6' }), 'not yet'),
    h('span', null, '🎙 = recordings')));
  const table = h('div', { class: 'tcard' });
  table.append(h('div', { class: 'trow head' }, h('div', null, '#'), h('div', null, 'Name'), h('div', null, 'Lines'), h('div', { class: 'hide-s' }, '🎙'), h('div', { class: 'hide-s' }, 'Last active')));
  students.forEach(st => {
    const prog = data.progress[st.num] || {};
    const recs = (data.recordings || {})[st.num] || {};
    const ls = myLines(st.num);
    const passed = ls.filter(l => (prog[l.id] || {}).passed).length;
    const lastAct = st.lastActive || Math.max(0, ...Object.values(prog).map(p => p.updated || 0));
    const row = h('div', { class: 'trow' },
      h('div', { class: 'n c' + ((st.num - 1) % COLORS) }, st.num),
      h('div', null, h('b', null, st.name || '—'), st.grade || st.cls ? h('div', { class: 'small' }, 'Grade ' + (st.grade || '?') + ' · Class ' + (st.cls || '?')) : null),
      h('div', null, h('div', { class: 'small' }, passed + ' / ' + ls.length + ' passed'),
        h('div', { class: 'chips' }, ls.map(l => { const p = prog[l.id]; return h('i', { class: 'chip' + (p ? (p.passed ? ' passed' : ' tried') : ''), title: 'Scene ' + l.scene + ': ' + l.text }); }))),
      h('div', { class: 'hide-s' }, Object.keys(recs).length + ' / ' + ls.length),
      h('div', { class: 'hide-s small' }, lastAct ? fmtDate(lastAct) : 'never'));
    let detail = null;
    row.onclick = () => {
      if (detail) { detail.remove(); detail = null; return; }
      detail = h('div', { class: 'tdetail' });
      ls.forEach(l => {
        const p = prog[l.id];
        const words = lineWords(l, st, true);
        const res = p && p.heard ? checkSpeech(words, p.heard) : null;
        const rec = recs[l.id];
        const audioHolder = h('div');
        detail.append(h('div', { class: 'tline' },
          h('div', { class: 'small' }, 'Scene ' + l.scene + ' · ' + whoLabel(l)),
          wordsEl(words, res),
          h('div', { class: 'meta' },
            p ? (p.passed ? '✓ Passed' : '✗ Not passed') + ' · best ' + p.best + '% · last ' + p.last + '% · ' + p.tries + (p.tries === 1 ? ' try · ' : ' tries · ') + fmtDate(p.updated) : 'Not practiced yet',
            p && p.heard ? h('div', null, 'Last heard: “' + p.heard + '”') : null),
          rec && !TEST_MODE ? h('div', { class: 'row', style: 'margin-top:6px' }, btn('▶', 'Play recording', fmtDate(rec.updated), 'small', async (e) => {
            const b = e.currentTarget; b.disabled = true;
            try {
              const j = await api('teacherRecording', { code, fileId: rec.fileId });
              const blob = b64ToBlob(j.base64, j.mime);
              audioHolder.innerHTML = '';
              const a = h('audio', { controls: true, src: URL.createObjectURL(blob), style: 'width:100%;margin-top:6px' });
              audioHolder.append(a); a.play().catch(() => {});
            } catch (err) { toast('Could not load the recording.'); }
            b.disabled = false;
          })) : null,
          audioHolder));
      });
      row.after(detail);
    };
    table.append(row);
  });
  body.append(table);
  return true;
}

// ---------- router ----------
function route(){
  const hsh = location.hash || '#/';
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  let m;
  if ((m = hsh.match(/^#\/s\/(\d+)/))) { const n = +m[1]; if (n >= 1 && n <= NUM_STUDENTS) { if (S.num !== n) currentScene = null; renderStudent(n); return; } }
  if (hsh.startsWith('#/teacher')) { renderTeacher(); return; }
  if (hsh.startsWith('#/practice')) { renderPractice(); return; }
  renderHome();
}
window.addEventListener('hashchange', route);
window.addEventListener('online', () => flush());
route();
</script>
