<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Guanmiao Ambassadors</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f2e9; --card:#ffffff; --ink:#1c2333; --muted:#5f6779; --line:#e4dccb;
  --brand:#1f3a68; --brand-2:#2d5ca6; --brand-soft:#e8eef8;
  --accent:#f2b23a; --accent-ink:#5a3d00;
  --mine:#fff5d6; --mine-border:#f2b23a;
  --ok:#17834a; --ok-bg:#ddf3e5; --bad:#cf3434; --bad-bg:#fde6e6; --free:#2b67cc; --free-bg:#e5eefc;
  --shadow:0 1px 2px rgba(28,35,51,.06),0 4px 14px rgba(28,35,51,.06);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.zh{font-size:.86em;color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:10px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.topbar .who{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:10px;min-width:0}
.topbar .who .badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:44px;height:44px;display:grid;place-items:center;font-weight:900;font-size:1.1rem}
.topbar .who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:8px 12px;min-height:44px;font-weight:600;font-size:.92rem}
.tbtn:active{background:rgba(255,255,255,.25)}
.sync{font-size:.8rem;opacity:.9;white-space:nowrap}
.pbar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;width:120px}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ptext{font-size:.85rem;font-weight:600;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;min-height:46px;font-weight:650;font-size:.95rem;line-height:1.15;text-align:left}
.btn .zh{font-size:.8rem;font-weight:500}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary .zh{color:#dfe8fb}
.btn.mic{background:#fff0f0;border-color:#f3b9b9;color:#9b1c1c}
.btn.mic .zh{color:#b04848}
.btn.rec{background:#fff4e0;border-color:#f0cf91;color:#7a4b00}
.btn.rec .zh{color:#94681b}
.btn.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.btn.live .zh{color:#ffe1e1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(207,52,52,.45)}50%{box-shadow:0 0 0 8px rgba(207,52,52,0)}}
.btn.small{min-height:40px;padding:6px 11px;font-size:.88rem}
.ico{font-size:1.15em;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- home ---------- */
.hero{background:var(--brand);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 0 64px;position:relative;overflow:hidden}
.hero h1{margin:0;font-size:2rem;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:.4rem 0 0;opacity:.9}
.hero .zh{color:#cfdaf0}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--accent);opacity:.18}
.homecard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-top:-40px;padding:22px 18px 26px;position:relative}
.homecard h2{margin:0 0 4px;font-size:1.15rem}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;margin-top:16px}
.numbtn{aspect-ratio:1;border-radius:22px;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.15);padding:6px}
.numbtn .nnum{font-size:2.1rem;font-weight:900;line-height:1}
.numbtn .nname{font-size:.95rem;font-weight:700;opacity:.95;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.numbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.c0{background:#2d5ca6}.c1{background:#e0802a}.c2{background:#178a6a}.c3{background:#b5487d}.c4{background:#6a55c2}.c5{background:#c79a12}.c6{background:#1f8bb3}
.homelinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}

/* ---------- dialog ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,26,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h3{margin:0 0 6px;font-size:1.3rem}
.codein{width:100%;font-size:2rem;letter-spacing:.4em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px;margin:14px 0 8px}
.codein:focus{outline:none;border-color:var(--brand-2)}
.err{color:var(--bad);font-weight:600;min-height:1.4em;font-size:.95rem}
.note{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:.92rem;color:#24406f}
.warn{background:#fff3d6;border:1px solid #f0d28c;border-radius:12px;padding:10px 12px;font-size:.92rem;color:#6a4a00}

/* ---------- scenes ---------- */
.scenetabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.scenetabs::-webkit-scrollbar{display:none}
.stab{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px;font-weight:700;display:flex;align-items:center;gap:6px}
.stab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stab .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.stab .done{color:var(--ok);font-weight:900}
.stab.on .done{color:#9ff0bf}
.scenehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 12px}
.scenehead h2{margin:0;font-size:1.45rem;line-height:1.2}
.scenehead .kicker{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}

.lines{display:flex;flex-direction:column;gap:12px;padding-bottom:40px}
.place{font-weight:800;color:var(--brand);margin:8px 0 -4px;font-size:1rem}
.place .zh{font-weight:600}
.line{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--shadow);transition:box-shadow .2s, border-color .2s}
.line.mine{background:var(--mine);border-color:var(--mine-border);border-width:2px}
.line.reading{box-shadow:0 0 0 4px rgba(45,92,166,.35)}
.lhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.spk{font-size:.8rem;font-weight:800;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 10px}
.line.mine .spk{background:var(--accent);color:var(--accent-ink)}
.yours{font-size:.78rem;font-weight:800;color:#8a5a00;letter-spacing:.03em}
.status{margin-left:auto;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#eee;color:#555}
.status.passed{background:var(--ok-bg);color:var(--ok)}
.status.tried{background:#fff0d0;color:#8a5a00}
.ltext{display:flex;align-items:flex-start;gap:8px}
.words{font-size:1.4rem;font-weight:600;line-height:1.55;flex:1}
.line:not(.mine) .words{font-size:1.15rem;font-weight:500}
.w{display:inline-block;border-radius:7px;padding:0 2px;margin:0 1px;cursor:pointer;transition:background .15s}
.w:active,.w.tap{background:rgba(45,92,166,.18)}
.w.ok{color:var(--ok);background:var(--ok-bg)}
.w.bad{color:var(--bad);background:var(--bad-bg)}
.w.miss{color:var(--bad);background:var(--bad-bg);text-decoration:underline dotted;text-underline-offset:4px}
.w.free{color:var(--free);background:var(--free-bg)}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--muted);color:var(--muted);text-align:center}
.say{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:1.25rem;display:grid;place-items:center}
.ltrans{margin-top:2px}
.tools{margin-top:12px;padding-top:12px;border-top:1px dashed #e9cf8c;display:flex;flex-direction:column;gap:10px}
.result{background:#fff;border-radius:12px;border:1px solid var(--line);padding:10px 12px}
.result .score{font-weight:900;font-size:1.25rem}
.result .heard{font-size:.95rem;color:var(--muted);margin-top:4px;word-break:break-word}
.result .msg{font-weight:700}
.recbox{background:#fff;border-radius:12px;border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.recbox audio{width:100%;height:44px}
.recstate{font-size:.88rem;color:var(--muted)}
.recstate.ok{color:var(--ok);font-weight:700}
.recstate.bad{color:var(--bad);font-weight:700}
.fill{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fill label{display:flex;flex-direction:column;font-size:.85rem;font-weight:700;color:var(--muted);gap:4px}
.fill input,.fill select{min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:1.05rem;background:#fff;color:var(--ink);min-width:110px}
.fill input.name{min-width:180px}

/* ---------- progress card ---------- */
.pcard{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.pshot{padding:22px;background:#fff}
.pshot .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.pshot .ph .badge{background:var(--accent);color:var(--accent-ink);border-radius:16px;width:58px;height:58px;display:grid;place-items:center;font-weight:900;font-size:1.5rem}
.pshot h3{margin:0;font-size:1.3rem}
.pbig{height:14px;background:#eee;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.pbig>i{display:block;height:100%;background:var(--ok)}
.pscene{margin-top:14px}
.pscene h4{margin:0 0 6px;font-size:.95rem;color:var(--brand)}
.pline{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.pline .words{font-size:1.05rem;font-weight:600}
.pline .meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.pfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- teacher ---------- */
.tcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.trow{display:grid;grid-template-columns:52px 1.3fr 1.6fr .8fr 1fr;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.trow.head{background:#faf7f0;font-size:.8rem;font-weight:800;color:var(--muted);cursor:default}
.trow .n{font-weight:900;color:#fff;border-radius:12px;height:40px;display:grid;place-items:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{width:18px;height:18px;border-radius:5px;background:#e6e1d6}
.chip.tried{background:#f2c35f}
.chip.passed{background:var(--ok)}
.tdetail{padding:6px 14px 16px;background:#fcfaf5;border-bottom:1px solid var(--line)}
.tline{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.tline .words{font-size:1.05rem;font-weight:600}
.tline .meta{font-size:.85rem;color:var(--muted);margin-top:4px}
.small{font-size:.85rem;color:var(--muted)}
textarea.paste{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:1.1rem;background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-size:.95rem;max-width:calc(100% - 32px);text-align:center}
@media (max-width:640px){
  .trow{grid-template-columns:44px 1fr 1fr;}
  .trow .hide-s{display:none}
  .words{font-size:1.25rem}
  .hero h1{font-size:1.6rem}
}

/* ---------- v4: one sentence at a time ---------- */
.page{padding-top:18px;padding-bottom:48px;max-width:760px}
.ptitle{margin:0;font-size:1.6rem;line-height:1.2}
.pmeta{color:var(--muted);font-weight:600;margin:4px 0 10px}
.pbar2{height:12px;background:#e9e3d6;border-radius:99px;overflow:hidden;margin-bottom:18px}
.pbar2>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.mylist{display:flex;flex-direction:column;gap:10px}
.myitem{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.myitem:active{transform:translateY(1px)}
.mi-status{flex:0 0 auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#efe9dc;color:#6b6352;font-size:1rem}
.myitem.tried .mi-status{background:#fff0d0;color:#8a5a00;font-size:.9rem}
.myitem.done .mi-status{background:var(--ok);color:#fff;font-size:1.3rem}
.mi-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mi-scene{font-size:.8rem;font-weight:700;color:var(--muted)}
.mi-text{font-size:1.12rem;font-weight:650;line-height:1.35}
.mi-go{flex:0 0 auto;font-size:1.8rem;color:#b9b1a0;line-height:1}
.footnote{margin-top:22px;font-size:.8rem;color:var(--muted)}

.lv-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lv-top .count{margin-left:auto;font-weight:700;color:var(--muted)}
.lv-scene{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.lv-scene .kicker{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-2)}
.lv-sct{font-weight:800;font-size:1.1rem}
.saidby{font-size:.9rem;color:#7a5a12;font-weight:600;margin:2px 0 10px}
.sentcard{background:#fff;border:2px solid var(--mine-border);border-radius:20px;padding:20px 18px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.words.big{font-size:1.9rem;font-weight:700;line-height:1.6}
.w{border-bottom:2px dotted rgba(45,92,166,.35)}
.w.ok,.w.bad,.w.miss,.w.free{border-bottom-color:transparent}
.senthint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:8px;font-size:.88rem;color:var(--muted)}
.zhbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;min-height:36px;font-size:.9rem;font-weight:700;color:var(--muted)}
.zhbtn.on{background:var(--brand-soft);border-color:#c9d6ee;color:var(--brand)}
.zhline{margin-top:8px;font-size:1.05rem;color:var(--muted)}
.step{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.stepnum{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.step.done .stepnum{background:var(--ok)}
.stepbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.stephead{font-size:1.02rem}
.btn.playing{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.playing .zh{color:#dfe8fb}
.heard{font-size:.95rem;color:var(--muted);word-break:break-word}
.help b{display:block;margin-bottom:4px}
.help ol{margin:4px 0 0;padding-left:20px}
.help li{margin:3px 0}
.help .code{margin-top:6px;font-size:.78rem;color:#8b7a52}
.navrow{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.navrow .btn{flex:1;justify-content:center;min-height:54px}
.sheet{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.sheethead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheethead h3{margin:0;font-size:1.15rem;flex:1;min-width:150px}
.sheetbody{overflow:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:8px}
.sline{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.sline.mine{background:var(--mine);border-color:var(--mine-border)}
.sline.reading{box-shadow:0 0 0 4px rgba(45,92,166,.35)}
.sline .spkn{font-size:.78rem;font-weight:800;color:var(--muted)}
.sline.mine .spkn{color:#8a5a00}
.sline .words{font-size:1.15rem;font-weight:600}
.splace{font-weight:800;color:var(--brand);font-size:.92rem;margin-top:6px}
@media (max-width:640px){ .words.big{font-size:1.55rem} .ptitle{font-size:1.4rem} .hide-phone{display:none} .topbar .wrap{gap:8px} .tbtn{padding:8px 10px} }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   SETTINGS — the only part you normally need to change
   ===================================================================== */

// 1) After you deploy the Google Apps Script, paste the Web app URL between the quotes.
//    Leave it empty ('') to use TEST MODE (no codes, progress saves only on this device).
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxAICxSVv7EMtKRO_p9XoAdqE60pc-4MfZIo5FpSvwad03lwBMmZnXWmFrUZ8By2R86/exec';

// 2) The students: [class number, name]. These are the icons on the homepage.
//    The numbers must match column A of the "Students" sheet.
const STUDENTS = [
  [1,'Tammy'], [3,'Sherry'], [4,'Yuri'], [5,'Phoebe'], [7,'Angel'], [9,'Abbie'], [10,'Nora'],
  [11,'Judy'], [14,'Tim'], [16,'Jerry'], [22,'Trillion'], [24,'Sean'], [25,'Eric'], [27,'Angelina'],
];

// 3) The script. "who" = the speaker numbers for that line.
//    The numbers are the students' CLASS numbers from the list above (e.g. 10 = Nora).
//    'ALL' = everyone. 'EACH' = every student says their own version.
//    To change a speaker, just change the number(s) in who: [ ... ].
const SCENES = [
  { id:'1A', title:'Welcome at the school gate', zh:'在校門口歡迎', lines:[
    { who:[1], text:"Hello, everyone! We are student ambassadors.", zh:"大家好！我們是學生大使。" },
    { who:[3], text:"We are from Guanmiao Junior High School in Tainan, Taiwan.", zh:"我們來自台灣台南的關廟國中。" },
    { who:[4], text:"Today, we will show you our school.", zh:"今天，我們要帶大家看看我們的學校。" },
    { who:'ALL', text:"Welcome to Guanmiao Junior High School!", zh:"歡迎來到關廟國中！" },
  ]},
  { id:'1B', title:'Our town', zh:'我們的小鎮', lines:[
    { who:[1], text:"Our town, Guanmiao, is famous for three things.", zh:"我們的小鎮關廟，有三樣東西很有名。" },
    { who:[25], text:"Pineapples!", zh:"鳳梨！" },
    { who:[24], text:"Bamboo shoots!", zh:"竹筍！" },
    { who:[27], text:"Noodles!", zh:"關廟麵！" },
    { who:[3], text:"Now, come and see our school!", zh:"現在，來看看我們的學校吧！" },
  ]},
  { id:'2', title:'Introductions', zh:'自我介紹', lines:[

function apiErr(code){ const e = new Error(code); e.code = code; return e; }
async function api(action, payload, opts = {}){
  const tries = opts.tries || (RETRY_ACTIONS.has(action) ? 3 : 1);
  const timeout = opts.timeout || (action === 'uploadRecording' ? API_TIMEOUT * 2 : API_TIMEOUT);
  let last;
  for (let i = 0; i < tries; i++) {
    const ctrl = window.AbortController ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), timeout);
    try {
      const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload }), signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' });
      const text = await res.text();
      clearTimeout(timer);
      let j;
      try { j = JSON.parse(text); } catch (e) { throw apiErr('bad_response'); }
      if (!j.ok) throw apiErr(j.error || 'error');
      return j;
    } catch (e) {
      clearTimeout(timer);
      last = e.name === 'AbortError' ? apiErr('timeout') : (e.code ? e : apiErr('offline'));
      if (['wrong_code', 'not_found', 'unknown_action'].includes(last.code)) throw last;
      if (opts.onRetry && i < tries - 1) opts.onRetry(i + 1);
      if (i < tries - 1) await sleep(1500 * (i + 1));
    }
  }
  throw last;
}
function apiErrorText(e){
  if (e.code === 'wrong_code') return 'Wrong code. Try again. 代碼錯誤，請再試一次。';
  if (e.code === 'timeout') return 'Google is answering too slowly. Wait a moment and tap again. Google 回應太慢，請稍等再按一次。';
  if (e.code === 'bad_response') return 'Google sent back an error page. (Teacher: check the Web app deployment.) Google 回傳錯誤，請告訴老師。';
  if (e.code === 'offline' || !navigator.onLine) return 'No connection. Check the Wi-Fi and tap again. 無法連線，請檢查網路再按一次。';
  return 'Google had a problem. Tap again. Google 出了問題，請再按一次。';
}

// Current student state
const S = { num: 0, code: '', profile: {}, progress: {}, recordings: {}, localRec: {}, pending: [], sync: 'ok' };

function cacheKey(n){ return 's' + n; }
function saveCache(){ lsSet(cacheKey(S.num), { profile: S.profile, progress: S.progress }); lsSet('pending' + S.num, S.pending); }

async function login(num, code, onRetry){
  if (TEST_MODE) {
    const c = lsGet(cacheKey(num), {});
    Object.assign(S, { num, code, profile: c.profile || {}, progress: c.progress || {}, recordings: {}, localRec: S.num === num ? S.localRec : {}, pending: [] });
    if (!S.profile.name && NAMES[num]) S.profile.name = NAMES[num];
    return;
  }
  const j = await api('login', { num, code }, { onRetry });
  const c = lsGet(cacheKey(num), {});
  const pending = lsGet('pending' + num, []);
  const progress = j.progress || {};
  // keep anything saved on this iPad that didn't reach Google yet
  pending.forEach(it => { if (!progress[it.lineId] || (progress[it.lineId].updated || 0) < it.updated) progress[it.lineId] = it; });
  const profile = j.profile || {};
  if (c.profile && !profile.name && c.profile.name) Object.assign(profile, c.profile);
  if (!profile.name && NAMES[num]) profile.name = NAMES[num];
  Object.assign(S, { num, code, profile, progress, recordings: j.recordings || {}, localRec: S.num === num ? S.localRec : {}, pending });
  saveCache();
  flush();
}
function setSync(s){ S.sync = s; const el = document.getElementById('sync'); if (el) el.innerHTML = syncHtml(); }
function syncHtml(){
  if (TEST_MODE) return 'Test mode · saved on this iPad only';
  return { ok: 'Saved ✓ 已儲存', saving: 'Saving… 儲存中', offline: 'Not saved yet — will retry 尚未儲存，稍後重試' }[S.sync] || '';
}
let flushing = false;
async function flush(){
  if (TEST_MODE || flushing || !S.pending.length) return;
  flushing = true; setSync('saving');
  const items = S.pending.slice();
  try {
    await api('saveProgress', { num: S.num, code: S.code, items });
    S.pending = S.pending.filter(p => !items.includes(p));
    saveCache(); setSync('ok');
  } catch (e) { setSync('offline'); setTimeout(() => { flushing = false; flush(); }, 15000); return; }
  flushing = false;
  if (S.pending.length) flush();
}
function recordAttempt(ln, text, result, heard){
  const prev = S.progress[ln.id] || { tries: 0, best: 0, passed: false };
  const item = {
    lineId: ln.id, scene: ln.scene, text,
    passed: prev.passed || result.passed, best: Math.max(prev.best || 0, result.score),
    tries: (prev.tries || 0) + 1, heard, last: result.score, updated: Date.now()
  };
  S.progress[ln.id] = item;
  S.pending = S.pending.filter(p => p.lineId !== ln.id); S.pending.push(item);
  saveCache(); flush();
  return item;
}
async function saveProfile(){
  saveCache();
  if (TEST_MODE) return;
  try { setSync('saving'); await api('saveProfile', { num: S.num, code: S.code, profile: S.profile }); setSync('ok'); }
  catch (e) { setSync('offline'); }
}

// ---------- tiny DOM helpers ----------
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c === null || c === undefined || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
function bi(en, zh){ return [h('span', null, en), zh ? h('span', { class: 'zh' }, zh) : null]; }
function btn(icon, en, zh, cls, onclick){ return h('button', { class: 'btn ' + (cls || ''), onclick }, h('span', { class: 'ico' }, icon), h('span', { class: 'lbl' }, en, h('br'), h('span', { class: 'zh' }, zh))); }
let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast' }, msg); document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3500);
}
function fmtTime(ms){ const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtDate(t){ if (!t) return '—'; const d = new Date(t); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
function slug(s){ return s.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40); }

// A Listen button that turns into a Stop button while it plays
function playButton(icon, en, zh, cls, getItems, opts = {}){
  const b = btn(icon, en, zh, cls);
  let playing = false;
  const show = p => { playing = p; b.classList.toggle('playing', p); setIcon(b, p ? '■' : icon); setLabel(b, p ? 'Stop' : en, p ? '停止' : zh); };
  b.addEventListener('click', () => {
    if (playing) { ttsStop(); return; }
    const items = getItems(); if (!items) return;
    show(true);
    playItems(items, { slow: opts.slow, onItem: opts.onItem, reset: () => { show(false); opts.onDone && opts.onDone(); } });
  });
  return b;
}

const MIC_STEPS = [

  } else if (code === 'service-not-allowed') {
    add('Speech checking is blocked on this device. 這台裝置封鎖了語音檢查。 Try these one by one:', [

/* =====================================================================
   LINE PANEL — one sentence with ① Listen ② Say it ③ Record
   mode: 'student' (saves) or 'practice' (free practice, no saving)
   ===================================================================== */
function linePanel(ln, mode, onChange){
  const el = h('div');
  let lastResult = null, lastHeard = '', err = null;
  const ui = {};
  const prof = () => (mode === 'student' ? S.profile : {});
  const getWords = () => lineWords(ln, prof(), true);
  const getText = () => lineText(ln, prof(), true);
  const ready = () => mode === 'practice' || blanksFilled(ln, S.profile);
  const sentenceItems = () => {
    const t = getText();
    if (/____/.test(t)) { toast('Fill in the blanks first. 請先填空。'); return null; }
    return [{ text: t, url: lineAudio(ln) }];
  };

  function step(n, en, zh, done, body){
    return h('div', { class: 'step' + (done ? ' done' : '') },
      h('div', { class: 'stepnum' }, done ? '✓' : String(n)),
      h('div', { class: 'stepbody' }, h('div', { class: 'stephead' }, h('b', null, en), ' ', h('span', { class: 'zh' }, zh)), body));
  }

  function render(){
    el.innerHTML = '';
    const words = getWords();
    el.append(h('div', { class: 'sentcard' },
      wordsEl(words, lastResult, 'big'),
      zhLine(ln.zh),
      h('div', { class: 'senthint' }, h('span', null, '👆 Tap a word to hear it. ', h('span', { class: 'zh' }, '點單字聽發音')), ln.zh ? zhButton() : null)));

    if (needsBlanks(ln) && mode === 'student') {
      el.append(h('div', { class: 'step' }, h('div', { class: 'stepnum' }, '✎'),
        h('div', { class: 'stepbody' }, h('div', { class: 'stephead' }, h('b', null, 'Fill in first'), ' ', h('span', { class: 'zh' }, '先填空')),
          fillForm(ln, () => { lastResult = null; render(); onChange && onChange(); }))));
    }

    // ① Listen
    el.append(step(1, 'Listen', '聽', false, h('div', { class: 'row' },
      playButton('▶', 'Listen', '聽', 'primary', sentenceItems),
      playButton('🐢', 'Slow', '慢速', '', sentenceItems, { slow: true }))));

    // ② Say it
    const p = mode === 'student' ? S.progress[ln.id] : null;
    ui.tryB = btn('🎤', lastResult ? 'Try again' : 'Try it', lastResult ? '再試一次' : '試試看', 'mic', () => doTry());
    if (!ready()) ui.tryB.disabled = true;
    const s2 = h('div', { class: 'stepbody', style: 'gap:8px' }, h('div', { class: 'row' }, ui.tryB));
    if (lastResult) {
      const ok = lastResult.passed, mid = lastResult.score >= 60;
      s2.append(h('div', null,
        h('div', { class: 'row' },
          h('span', { class: 'score', style: 'font-weight:900;font-size:1.3rem;color:' + (ok ? 'var(--ok)' : mid ? '#b07600' : 'var(--bad)') }, lastResult.score + '%'),
          h('b', null, ok ? '🎉 Perfect! 太棒了！' : mid ? 'Almost! Practice the red words. 快好了！練習紅色的字。' : 'Listen again, then try again. 再聽一次，再試一次。')),
        h('div', { class: 'heard' }, 'I heard 我聽到: “' + (lastHeard || '…') + '”')));
    } else if (p) {
      s2.append(h('div', { class: 'heard' }, p.passed ? '✓ You passed this line before. 你已經通過了。' : 'Your best: ' + p.best + '% 最佳'));
    }
    if (!ready()) s2.append(h('div', { class: 'small' }, 'Fill in the blanks first. 請先填空。'));
    if (err && err.step === 2) s2.append(err.node);
    el.append(step(2, 'Say it', '說說看', !!(p && p.passed), s2));

    // ③ Record
    ui.recB = btn('⏺', 'Record', '錄音', 'rec', () => doRecord());
    if (!ready()) ui.recB.disabled = true;
    const s3 = h('div', { class: 'stepbody', style: 'gap:8px' });
    const rb = recBox();
    if (!rb) s3.append(h('div', { class: 'row' }, ui.recB)); else s3.append(rb);
    if (err && err.step === 3) s3.append(err.node);
    el.append(step(3, 'Record', '錄音', !!(rb && (S.recordings[ln.id] || (S.localRec[ln.id] && S.localRec[ln.id].state === 'sent'))), s3));
  }

  async function doTry(){
    err = null;
    if (IN_APP) { err = { step: 2, node: micHelp('in-app') }; render(); return; }
    if (!SR) { err = { step: 2, node: micHelp('no-speech-api') }; render(); return; }
    if (busy) return;
    ttsStop();
    busy = 'try';
    const b = ui.tryB;
    b.classList.add('live'); setIcon(b, '■'); setLabel(b, 'Listening… tap to stop', '聆聽中…點一下停止');
    const live = h('div', { class: 'heard' }, '🎙 Say the sentence now… 現在說出句子…');
    b.closest('.row').after(live);
    const words = getWords();
    const r = recognize(Math.min(25000, 5000 + words.length * 700), t => { live.textContent = '🎙 ' + t; });
    b.onclick = (e) => { e.stopImmediatePropagation(); r.stop(); };
    try {
      const out = await r.promise;
      busy = null;
      if (!out.text) {
        lastResult = null;
        err = { step: 2, node: h('div', { class: 'warn' }, "I didn't hear anything. Tap Try it and speak a little louder. 沒聽到聲音，請大聲一點再試一次。") };
        render(); return;
      }
      let best = null, bestText = out.text;
      out.alts.forEach(a => { const c = checkSpeech(words, a); if (!best || c.score > best.score) { best = c; bestText = a; } });
      lastResult = best; lastHeard = bestText;
      if (mode === 'student') { recordAttempt(ln, getText(), best, bestText); onChange && onChange(); }
      render();
    } catch (e) {
      busy = null; err = { step: 2, node: micHelp(String(e)) }; render();
    }
  }

  async function doRecord(){
    err = null;
    if (IN_APP) { err = { step: 3, node: micHelp('in-app') }; render(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { err = { step: 3, node: micHelp('no-speech-api') }; render(); return; }
    if (busy) return;
    ttsStop();
    busy = 'rec';
    let rec;
    try {
      rec = await startRecording(30000, ms => { if (ui.recB) setLabel(ui.recB, 'Recording ' + fmtTime(ms) + ' · tap to stop', '錄音中…點一下停止'); });
    } catch (e) {
      busy = null; err = { step: 3, node: micHelp(e && e.name || 'error') }; render(); return;
    }
    render(); // show the record button in "recording" state
    const b = ui.recB;
    if (b) {
      b.classList.add('live'); setIcon(b, '■');
      b.onclick = (e) => { e.stopImmediatePropagation(); rec.stop(); };
    }
    const blob = await rec.promise;
    busy = null;
    const st = { blob, url: URL.createObjectURL(blob), state: mode === 'student' && !TEST_MODE ? 'sending' : 'local' };
    S.localRec[ln.id] = st;
    render();
    if (st.state === 'sending') upload(st);
  }
  async function upload(st){
    st.state = 'sending'; render();
    try {
      const b64 = await blobToB64(st.blob);
      const j = await api('uploadRecording', { num: S.num, code: S.code, lineId: ln.id, text: getText(), mime: st.blob.type, base64: b64 });
      S.recordings[ln.id] = j.recording; st.state = 'sent';
    } catch (e) { st.state = 'failed'; }
    render(); onChange && onChange();
  }
  function fileName(blob){
    const who = mode === 'practice' ? 'practice' : '#' + String(S.num).padStart(2, '0');
    return who + '_Scene' + ln.scene + '_' + slug(getText()) + '.' + extFor(blob.type);
  }
  function recBox(){
    if (busy === 'rec') return null;
    const st = S.localRec[ln.id] || null;
    const saved = mode === 'student' ? S.recordings[ln.id] : null;
    if (!st && !saved) return null;
    const box = h('div', { class: 'recbox' });
    if (st) {
      box.append(h('audio', { controls: true, src: st.url, preload: 'auto' }));
      const txt = {
        local: TEST_MODE && mode === 'student' ? 'Test mode: not sent to the teacher. 測試模式：不會傳給老師。' : 'Your recording 你的錄音',
        sending: 'Sending to teacher… 傳送給老師中…', sent: '✓ Sent to teacher 已傳給老師', failed: '✗ Not sent. Tap "Send again". 傳送失敗，請點「再傳一次」。'
      }[st.state];
      box.append(h('div', { class: 'recstate ' + (st.state === 'sent' ? 'ok' : st.state === 'failed' ? 'bad' : '') }, txt));
    } else {
      box.append(h('div', { class: 'recstate ok' }, '✓ Your recording is saved for the teacher. 你的錄音已存給老師。'));
      box.append(h('div', { class: 'row' }, btn('▶', 'Play my recording', '播放我的錄音', 'small', async (e) => {
        const b = e.currentTarget; b.disabled = true;
        try {
          const j = await api('getRecording', { num: S.num, code: S.code, fileId: saved.fileId });
          const blob = b64ToBlob(j.base64, j.mime);
          S.localRec[ln.id] = { blob, url: URL.createObjectURL(blob), state: 'sent' };
          render();
          const a = el.querySelector('audio'); a && a.play().catch(() => {});
        } catch (err2) { b.disabled = false; toast('Could not load the recording. 無法載入錄音。'); }
      })));
    }
    const row = h('div', { class: 'row' });
    if (st && st.state === 'failed') row.append(btn('↻', 'Send again', '再傳一次', 'small primary', () => upload(st)));
    row.append(btn('⏺', 'Record again', '重錄', 'small rec', () => doRecord()));
    row.append(btn('🗑', 'Delete', '刪除', 'small', async () => {
      if (!confirm('Delete this recording? 要刪除這個錄音嗎？')) return;
      delete S.localRec[ln.id];
      if (mode === 'student' && !TEST_MODE && S.recordings[ln.id]) {
        try { await api('deleteRecording', { num: S.num, code: S.code, lineId: ln.id }); delete S.recordings[ln.id]; }
        catch (e) { toast('Could not delete. Check the internet. 無法刪除，請檢查網路。'); }
      }
      render(); onChange && onChange();
    }));
    if (st) row.append(btn('⬇', 'Download', '下載', 'small', () => downloadBlob(st.blob, fileName(st.blob))));
    box.append(row);
    return box;
  }

  render();
  return el;
}

  const form = h('div', { class: 'fill' });
  const inputs = {};
  const sel = (key, opts, label) => {
    const s = h('select', null, h('option', { value: '' }, '—'), opts.map(([v, z]) => h('option', { value: v }, z ? v + '  ' + z : v)));
    s.value = p[key] || '';
    inputs[key] = s;
    return h('label', null, label, s);
  };
  keys.forEach(k => {
    if (k === 'name') { const i = h('input', { class: 'name', placeholder: 'Your English name', autocomplete: 'off', autocapitalize: 'words' }); i.value = p.name || ''; inputs.name = i; form.append(h('label', null, 'My name 我的名字', i)); }
    if (k === 'grade') form.append(sel('grade', GRADES.map(g => [g]), 'Grade 年級'));
    if (k === 'cls') { const i = h('input', { inputmode: 'numeric', placeholder: 'e.g. 3', autocomplete: 'off', style: 'min-width:90px;width:110px' }); i.value = p.cls || ''; inputs.cls = i; form.append(h('label', null, 'Class 班級', i)); }

  });
  form.append(btn('✓', 'Save', '儲存', 'primary small', () => {
    keys.forEach(k => { p[k] = String(inputs[k].value || '').trim().replace(/\s+/g, ' '); });
    saveProfile(); onSave && onSave(); toast('Saved! 已儲存！');
  }));
  return form;
}

function codeDialog(n){
  const err = h('div', { class: 'err' });
  const input = h('input', { class: 'codein', inputmode: 'numeric', autocomplete: 'off', maxlength: '8', 'aria-label': 'Code' });
  const enter = h('button', { class: 'btn primary', style: 'width:100%;justify-content:center;min-height:52px' }, 'Enter 進入');
  const wait = h('div', { class: 'small', style: 'text-align:center;min-height:1.3em;margin-bottom:6px' });
  const close = () => ov.remove();
  const submit = async () => {
    const code = input.value.trim();
    if (!TEST_MODE && !code) { err.textContent = 'Type your code. 請輸入代碼。'; return; }
    if (enter.disabled) return;
    enter.disabled = true; err.textContent = '';
    const t0 = Date.now();
    wait.textContent = 'Connecting to Google… 連線中…';
    const tick = setInterval(() => {
      const s = Math.round((Date.now() - t0) / 1000);
      if (s >= 4) wait.textContent = 'Connecting to Google… ' + s + 's. Please wait. 連線中，請稍等…';
    }, 1000);
    try {
      await login(n, code, (k) => { wait.textContent = 'Trying again (' + (k + 1) + ')… 再試一次…'; });
      ssSet('session', { num: n, code });
      close(); go('#/s/' + n);
    } catch (e) {
      err.textContent = apiErrorText(e);
    } finally {
      clearInterval(tick); wait.textContent = ''; enter.disabled = false;
    }
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  enter.onclick = submit;
  const ov = h('div', { class: 'overlay', onclick: e => { if (e.target === ov) close(); } },
    h('div', { class: 'dialog' },
      h('h3', null, label(n)),
      h('div', { class: 'zh' }, TEST_MODE ? 'Test mode: any code works. 測試模式：任何代碼都可以。' : 'Type your code. 請輸入你的代碼。'),
      input, err, wait, enter,
      h('button', { class: 'btn', style: 'width:100%;justify-content:center;margin-top:8px', onclick: close }, 'Cancel 取消')));
  document.body.append(ov);
  setTimeout(() => input.focus(), 50);
}

      const name = '#' + String(n).padStart(2, '0') + '_progress_' + new Date().toISOString().slice(0, 10) + '.png';
      const file = new File([blob], name, { type: 'image/png' });

      } else downloadBlob(blob, name);

    saveBtn, btn('✕', 'Close', '關閉', '', () => ov.remove()))));
  document.body.append(ov);
}
let h2cPromise;
function loadH2C(){
  if (window.html2canvas) return Promise.resolve();
  h2cPromise = h2cPromise || new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = res; s.onerror = () => { h2cPromise = null; rej(); };
    document.head.append(s);
  });
  return h2cPromise;
}

async function loadTeacher(code, body, bar, errEl){
  let data;
  if (TEST_MODE) {
    data = { students: [], progress: {}, recordings: {} };
    for (const [n] of STUDENTS) {
      const c = lsGet(cacheKey(n), {});
      data.students.push({ num: n, ...(c.profile || {}) });
      data.progress[n] = c.progress || {};
    }
  } else {
    try { data = await api('teacherData', { code }); }
    catch (e) {
      if (errEl) errEl.textContent = e.code === 'wrong_code' ? 'Wrong teacher code.' : apiErrorText(e);
      else { body.innerHTML = ''; body.append(h('div', { class: 'warn', style: 'margin-top:20px' }, apiErrorText(e) + ' Tap Refresh to try again.')); }
      return false;
    }
    ssSet('teacher', { code });
  }
  const wrap = bar.querySelector('.wrap');
  wrap.querySelectorAll('.tb-x').forEach(x => x.remove());
  wrap.append(
    h('button', { class: 'tbtn tb-x', onclick: () => { body.innerHTML = 'Loading…'; loadTeacher(code, body, bar); } }, '↻ Refresh'),
    TEST_MODE ? null : h('button', { class: 'tbtn tb-x', onclick: () => { ssSet('teacher', null); go('#/'); } }, 'Log out'));
  body.innerHTML = '';
  if (TEST_MODE) body.append(testBanner());

  const students = data.students.filter(st => NAMES[st.num]).sort((a, b) => a.num - b.num);
  const allLines = students.reduce((s, st) => s + myLines(st.num).length, 0);
  const allPassed = students.reduce((s, st) => s + myLines(st.num).filter(l => ((data.progress[st.num] || {})[l.id] || {}).passed).length, 0);
  body.append(h('div', { class: 'scenehead', style: 'margin-top:18px' },
    h('div', null, h('div', { class: 'kicker' }, 'Whole class'), h('h2', null, allPassed + ' / ' + allLines + ' lines passed')),
    h('div', { class: 'small' }, 'Updated ' + fmtDate(Date.now()) + '. Tap a student to see each line and play recordings.')));
  body.append(h('div', { class: 'legend' },
    h('span', null, h('i', { class: 'sw', style: 'background:var(--ok)' }), 'passed'),
    h('span', null, h('i', { class: 'sw', style: 'background:#f2c35f' }), 'tried'),
    h('span', null, h('i', { class: 'sw', style: 'background:#e6e1d6' }), 'not yet'),
    h('span', null, '🎙 = recordings')));
  const table = h('div', { class: 'tcard' });
  table.append(h('div', { class: 'trow head' }, h('div', null, '#'), h('div', null, 'Name'), h('div', null, 'Lines'), h('div', { class: 'hide-s' }, '🎙'), h('div', { class: 'hide-s' }, 'Last active')));
  students.forEach(st => {
    const prog = data.progress[st.num] || {};
    const recs = (data.recordings || {})[st.num] || {};
    const ls = myLines(st.num);
    const passed = ls.filter(l => (prog[l.id] || {}).passed).length;
    const lastAct = st.lastActive || Math.max(0, ...Object.values(prog).map(p => p.updated || 0));
    const row = h('div', { class: 'trow' },
      h('div', { class: 'n ' + colorOf(st.num) }, st.num),
      h('div', null, h('b', null, st.name || NAMES[st.num]), st.grade || st.cls ? h('div', { class: 'small' }, 'Grade ' + (st.grade || '?') + ' · Class ' + (st.cls || '?')) : null),
      h('div', null, h('div', { class: 'small' }, passed + ' / ' + ls.length + ' passed'),
        h('div', { class: 'chips' }, ls.map(l => { const p = prog[l.id]; return h('i', { class: 'chip' + (p ? (p.passed ? ' passed' : ' tried') : ''), title: 'Scene ' + l.scene + ': ' + l.text }); }))),
      h('div', { class: 'hide-s' }, Object.keys(recs).length + ' / ' + ls.length),
      h('div', { class: 'hide-s small' }, lastAct ? fmtDate(lastAct) : 'never'));
    let detail = null;
    row.onclick = () => {
      if (detail) { detail.remove(); detail = null; return; }
      detail = h('div', { class: 'tdetail' });
      ls.forEach(l => {
        const p = prog[l.id];
        const words = lineWords(l, { ...st, name: st.name || NAMES[st.num] }, true);
        const res = p && p.heard ? checkSpeech(words, p.heard) : null;
        const rec = recs[l.id];
        const audioHolder = h('div');
        detail.append(h('div', { class: 'tline' },
          h('div', { class: 'small' }, 'Scene ' + l.scene + ' · ' + whoLabel(l)),
          wordsEl(words, res),
          h('div', { class: 'meta' },
            p ? (p.passed ? '✓ Passed' : '✗ Not passed') + ' · best ' + p.best + '% · last ' + p.last + '% · ' + p.tries + (p.tries === 1 ? ' try · ' : ' tries · ') + fmtDate(p.updated) : 'Not practiced yet',
            p && p.heard ? h('div', null, 'Last heard: “' + p.heard + '”') : null),
          rec && !TEST_MODE ? h('div', { class: 'row', style: 'margin-top:6px' }, btn('▶', 'Play recording', fmtDate(rec.updated), 'small', async (e) => {
            const b = e.currentTarget; b.disabled = true;
            try {
              const j = await api('teacherRecording', { code, fileId: rec.fileId });
              const blob = b64ToBlob(j.base64, j.mime);
              audioHolder.innerHTML = '';
              const a = h('audio', { controls: true, src: URL.createObjectURL(blob), style: 'width:100%;margin-top:6px' });
              audioHolder.append(a); a.play().catch(() => {});
            } catch (err) { toast('Could not load the recording.'); }
            b.disabled = false;
          })) : null,
          audioHolder));
      });
      row.after(detail);
    };
    table.append(row);
  });
  body.append(table);
  return true;
}

// ---------- router ----------
function route(){
  const hsh = location.hash || '#/';
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  let m;
  if ((m = hsh.match(/^#\/s\/(\d+)(?:\/([\w-]+))?/))) { const n = +m[1]; if (NAMES[n]) { renderStudent(n, m[2] || null); return; } }
  if (hsh.startsWith('#/teacher')) { renderTeacher(); return; }
  if (hsh.startsWith('#/practice')) { renderPractice(); return; }
  renderHome();
}
window.addEventListener('hashchange', route);
window.addEventListener('online', () => flush());
route();
</script>
</body>
</html>
